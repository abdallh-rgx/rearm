name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabi, aarch64-unknown-linux-gnu
      - name: Install Z3
        run: |
          curl -sL -o z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.13.4/z3-4.13.4-x64-glibc-2.35.zip
          unzip -q z3.zip
          sudo cp z3-4.13.4-x64-glibc-2.35/bin/z3 /usr/local/bin/
          z3 --version
      - name: Build
        run: cargo build --verbose
      - name: Golden corpus round-trip tests
        run: cargo test -p rearm-core --test golden -- --nocapture
      - name: Z3 formal verification (A32→A64 1:1 proofs)
        run: cargo run -p rearm-cli --release -- verify
      - name: Regenerate golden corpus from LLVM (optional check)
        run: |
          # corpora are committed; regeneration requires rustc cross asm — skip on CI
          echo "corpora are committed under crates/rearm-core/tests/corpus/"
      - name: Bench (decode throughput)
        run: |
          echo "no test data binaries in repo (license hygiene); bench runs locally"
